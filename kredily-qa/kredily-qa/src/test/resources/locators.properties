# =====================================================================
# ALL locators live here. Format:  key=<strategy>=<value>
# strategies: id | acc (accessibility id) | xpath | text (UiSelector textContains)
# Capture real values with Appium Inspector against the installed APK,
# then replace every REPLACE_ME below. No Java change is needed.
# =====================================================================

# ---- Pop-ups / onboarding ----
popup.allow=id=com.android.permissioncontroller:id/permission_allow_foreground_only_button
popup.skip=text=Skip

# ---- Login ----
login.email=xpath=//android.widget.EditText[1]
login.password=xpath=//android.widget.EditText[2]
login.submit=text=Login
login.error=xpath=//*[contains(@text,'nvalid') or contains(@text,'ncorrect') or contains(@text,'required')]

# ---- Dashboard ----
dash.marker=text=REPLACE_ME_dashboard_title_or_greeting
dash.greeting=text=Good
dash.nav.home=acc=Home
dash.nav.attendance=text=Attendance
dash.nav.leave=text=Leave
dash.nav.profile=text=Profile

# ---- Attendance ----
att.checkin=text=Check In
att.checkout=text=Check Out
att.status=text=REPLACE_ME_status_label
att.success=xpath=//*[contains(@text,'uccess') or contains(@text,'Checked')]

# ---- Leave ----
leave.balance=text=Balance
leave.apply=text=Apply
leave.type=text=Leave Type
leave.type.first=xpath=(//android.widget.CheckedTextView)[1]
leave.reason=xpath=//android.widget.EditText[last()]
leave.submit=text=Submit
leave.error=xpath=//*[contains(@text,'equired') or contains(@text,'elect') or contains(@text,'nvalid')]
